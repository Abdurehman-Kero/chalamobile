# The free host puts the server to sleep after 15 quiet minutes, and waking it takes up to a minute.
# This visits it every 10 minutes so the app and the web store open straight away.
# Set the repository variable SERVER_URL (Settings > Secrets and variables > Actions > Variables)
# if the server address ever changes.
name: keep-warm
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the server
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 "${{ vars.SERVER_URL || 'https://chalamob-backend.onrender.com' }}/health"
